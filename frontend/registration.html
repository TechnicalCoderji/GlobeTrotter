<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - GlobeTrotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="auth-wrapper register-mode">
    <div class="auth-header">
      <a href="#" class="brand-logo">
        <i class="fa-solid fa-earth-americas"></i> GLOBETROTTER
      </a>
      <h2>Start your journey</h2>
      <p>Create an account to plan, budget, and share your trips</p>
    </div>

    <div class="auth-body">
      <form action="#" method="POST">
        <div class="form-grid">
          
          <div class="form-group">
            <label for="fname">First Name</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="fname" name="first_name" placeholder="John" required />
            </div>
          </div>

          <div class="form-group">
            <label for="lname">Last Name</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="lname" name="last_name" placeholder="Doe" required />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="email">Email Address</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" name="email" placeholder="john.doe@example.com" required />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="mobile">Mobile Number</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-phone"></i>
              <input type="tel" id="mobile" name="mobile" placeholder="+1 (555) 000-0000" required />
            </div>
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-city"></i>
              <input type="text" id="city" name="city" placeholder="e.g. San Francisco" required />
            </div>
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-globe"></i>
              <input type="text" id="country" name="country" placeholder="e.g. United States" required />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="reg-username">Username</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="reg-username" name="username" placeholder="johndoe_travels" required />
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="reg-password" name="password" placeholder="••••••••" required />
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-shield-halved"></i>
              <input type="password" id="confirm-password" name="confirm_password" placeholder="••••••••" required />
            </div>
          </div>

        </div>

        <div style="margin-top: 24px;">
          <button type="submit" class="btn-submit">
            <span>Create Account</span>
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

</body>
</html>
