<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - GlobeTrotter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="auth-wrapper register-mode">
    <div class="auth-header">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-earth-americas"></i> GLOBETROTTER
      </a>
      <h2>Start your journey</h2>
      <p>Create an account to plan, budget, and share your trips</p>
    </div>

    <div class="auth-body">
      <!-- Alert placeholder -->
      <div id="reg-alert" style="display: none;" class="alert-box alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="reg-alert-msg">Registration error.</span>
      </div>

      <form id="reg-form" onsubmit="handleRegister(event)">
        <div class="form-grid">
          
          <div class="form-group">
            <label for="fname">First Name</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="fname" name="first_name" placeholder="John" required />
            </div>
          </div>

          <div class="form-group">
            <label for="lname">Last Name</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="lname" name="last_name" placeholder="Doe" required />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="email">Email Address</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" name="email" placeholder="john.doe@example.com" required />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="mobile">Mobile Number</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-phone"></i>
              <input type="tel" id="mobile" name="phone_number" placeholder="+91 98765 43210" />
            </div>
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-city"></i>
              <input type="text" id="city" name="city" placeholder="e.g. Ahmedabad / Dwarka" />
            </div>
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-globe"></i>
              <input type="text" id="country" name="country" placeholder="e.g. India" />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="reg-username">Username</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="reg-username" name="username" placeholder="johndoe_travels" required />
            </div>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="reg-password" name="password" placeholder="••••••••" required minlength="6" />
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-shield-halved"></i>
              <input type="password" id="confirm-password" name="confirm_password" placeholder="••••••••" required minlength="6" />
            </div>
          </div>

        </div>

        <div style="margin-top: 24px;">
          <button type="submit" id="btn-reg-submit" class="btn-submit">
            <span>Create Account</span>
            <i class="fa-solid fa-user-plus"></i>
          </button>
        </div>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const alertBox = document.getElementById('reg-alert');
      const alertMsg = document.getElementById('reg-alert-msg');
      const submitBtn = document.getElementById('btn-reg-submit');

      alertBox.style.display = 'none';

      const firstName = document.getElementById('fname').value.trim();
      const lastName = document.getElementById('lname').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('mobile').value.trim();
      const city = document.getElementById('city').value.trim();
      const country = document.getElementById('country').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        alertMsg.textContent = 'Passwords do not match. Please verify your password.';
        alertBox.style.display = 'flex';
        return;
      }

      if (password.length < 6) {
        alertMsg.textContent = 'Password must be at least 6 characters long.';
        alertBox.style.display = 'flex';
        return;
      }

      setButtonLoading(submitBtn, true, 'Creating account...');

      const userData = {
        username: username,
        first_name: firstName,
        last_name: lastName,
        email: email,
        phone_number: phone,
        city: city || 'Ahmedabad',
        country: country || 'India',
        bio: 'Travel enthusiast exploring places with GlobeTrotter.',
        password1: password,
        password2: confirmPassword
      };

      const result = await GlobeTrotterAPI.register(userData);

      if (result.success) {
        showToast('Account created successfully! Welcome to GlobeTrotter.', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 700);
      } else {
        setButtonLoading(submitBtn, false);
        alertMsg.textContent = result.error || 'Registration failed. Username or email may already be taken.';
        alertBox.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
